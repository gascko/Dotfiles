theme = "gruvbox"

[editor]
line-number = "relative"
cursorline = true
scrolloff = 10
clipboard-provider = "wayland"
default-yank-register = "+"
# buffer/tab-like UI
bufferline = "multiple"

# completion
auto-completion = true
path-completion = true
auto-info = true

# format
auto-format = true

# UI
popup-border = "all"

gutters = [
    "diagnostics",
    "spacer",
    "line-numbers",
    "spacer",
    "diff"
]

# indentation
indent-heuristic = "hybrid"

[editor.cursor-shape]
normal = "bar"
insert = "bar"
select = "bar"

[editor.lsp]
enable = true
auto-signature-help = true
display-signature-help-docs = true
snippets = true

[keys.normal]
C-s = ":write"
C-n = ":new"
g = { b = "jump_backward" }
G = "goto_last_line"

[keys.insert]
C-s = ":write"
