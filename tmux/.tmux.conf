##### PREFIX

# Use CTRL-A instead of CTRL-B
unbind C-b
set -g prefix C-a
bind C-a send-prefix

##### GENERAL

set -g mouse on

# Reduce key sequence delay
set -sg escape-time 10

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows
set -g renumber-windows on

##### VI MODE

# Enable vim-style keybindings
setw -g mode-keys vi
set -g status-keys vi

##### SPLITS

# Vertical split, creates panes left/right
bind v split-window -h -c "#{pane_current_path}"

# Horizontal split, creates panes top/bottom
bind h split-window -v -c "#{pane_current_path}"

##### WINDOWS

# Spawn new window with n
bind n new-window

# Move to next window with alt+n
bind -n M-n next-window

# Move to previous window with alt+p
bind -n M-p previous-window

##### VIM-STYLE PANE NAVIGATION

# Move between panes using Alt + hjkl
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

##### PANE RESIZING

# Resize panes using Ctrl + hjkl
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

##### CLIPBOARD / COPY MODE

# Remap c to copy mode
bind c copy-mode

# Begin copy selection with v
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Copy selection directly to the Wayland clipboard
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# Copy selection with Enter as well
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "wl-copy"

# Paste from the Wayland clipboard
bind C-p run-shell "wl-paste | tmux load-buffer - && tmux paste-buffer"

# Keep tmux clipboard synchronized with the system clipboard
set -g set-clipboard on

##### STATUSBAR

set -g status-position top

set -g status-style "bg=default,fg=#{E:FOREGROUND_COLOR}"

set -g window-status-format "#[fg=#{E:DISABLED_COLOR},bg=default,bold]#[fg=#{E:FOREGROUND_COLOR},bg=#{E:DISABLED_COLOR},bold]#W (#I)#[fg=#{E:DISABLED_COLOR},bg=default,bold]"

set -g window-status-current-format "#[fg=#{E:FOREGROUND_COLOR},bg=default,bold]#[fg=black,bg=#{E:FOREGROUND_COLOR},bold]#W (#I)#[fg=#{E:FOREGROUND_COLOR},bg=default,bold]"

set -g window-status-separator " "

set -g status-left " "
set -g status-right ""

##### PANE BORDER

set -g pane-border-style "fg=#{E:FOREGROUND_COLOR}"
set -g pane-active-border-style "fg=#{E:FOREGROUND_COLOR}"

##### MESSAGES

set -g message-style "fg=#{E:FOREGROUND_COLOR},bg=default"

##### RELOAD CONFIG

bind r source-file ~/.tmux.conf \; display-message "Config reloaded"
