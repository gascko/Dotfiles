##### PREFIX

# Use CTRL-A instead of CTRL-B
unbind C-b
set -g prefix C-a
bind C-a send-prefix

##### GENERAL

set -g mouse on

# Reduce key sequence delay
set -sg escape-time 10

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows
set -g renumber-windows on

##### VI MODE

# Enable vim-style keybindings
setw -g mode-keys vi
set -g status-keys vi

# Enter copy mode with Prefix + [
bind [ copy-mode

##### SPLITS

# Vertical split, creates panes left/right
bind v split-window -h -c "#{pane_current_path}"

# Horizontal split, creates panes top/bottom
bind h split-window -v -c "#{pane_current_path}"

##### VIM-STYLE PANE NAVIGATION

# Move between panes using Alt + hjkl
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

##### PANE RESIZING

# Resize panes using Ctrl + hjkl
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

##### WAYLAND CLIPBOARD

# Copy selection directly to the Wayland clipboard
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# Copy selection with Enter as well
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "wl-copy"

# Paste from the Wayland clipboard
bind p run-shell "wl-paste | tmux load-buffer - && tmux paste-buffer"

# Keep tmux clipboard synchronized with the system clipboard
set -g set-clipboard on

##### GRUVBOX COLORS

set -g status-style "bg=#282828,fg=#ebdbb2"

set -g message-style "bg=#3c3836,fg=#fabd2f"
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#b8bb26"

set -g status-left ""
set -g status-right "#[fg=#a89984]%H:%M "

setw -g window-status-format " #I "
setw -g window-status-current-format \
  "#[fg=#282828,bg=#b8bb26,bold] #I "

##### RELOAD CONFIG

# Reload configuration without restarting tmux
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"
