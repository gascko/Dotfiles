[colors.primary]
background = "#000000"

[[keyboard.bindings]]
chars = "\u001BF"
key = "Right"
mods = "Alt"

[[keyboard.bindings]]
chars = "\u001BB"
key = "Left"
mods = "Alt"

[general]
live_config_reload = true

[env]
TERM = "alacritty"

[font]
size = 15
normal = { family = "monospace", style = "Regular" }
offset = { x = 0, y = 1 }
glyph_offset = { x = 0, y = 1 }

[scrolling]
history = 100000

[window]
decorations="None"
dynamic_title = true
title = "Terminal"
startup_mode="Maximized"
